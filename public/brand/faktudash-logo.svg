<svg width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FaktuDash Logo</title>
  <desc id="desc">Logo moderno de FaktuDash con documento de factura, gráfico de crecimiento y texto de marca.</desc>
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A4DFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="tealBlueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1155FF"/>
      <stop offset="100%" stop-color="#12D3A7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001240" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background: remove this rect if you want transparent background -->
  <rect width="1200" height="1000" fill="#FFFFFF"/>

  <!-- Icon group -->
  <g transform="translate(0, 10)" filter="url(#softShadow)">
    <!-- Invoice document outline -->
    <path d="M418 140
             C393 140 374 159 374 184
             V592
             C374 617 393 636 418 636
             H690
             M690 140
             H418
             M690 140
             L824 274
             V438"
          stroke="#06133B" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Page fold -->
    <path d="M690 140 V248
             C690 265 703 278 720 278
             H824"
          stroke="url(#blueGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M690 140 L824 274 H720 C703 274 690 261 690 244 V140Z"
          fill="url(#blueGradient)" fill-opacity="0.15"/>

    <!-- Euro symbol -->
    <text x="445" y="318" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="120" fill="#06133B">€</text>

    <!-- Document text lines -->
    <rect x="458" y="377" width="250" height="18" rx="9" fill="#06133B"/>
    <rect x="458" y="446" width="215" height="18" rx="9" fill="#06133B"/>
    <rect x="458" y="514" width="175" height="18" rx="9" fill="#06133B"/>
    <rect x="458" y="592" width="158" height="18" rx="9" fill="#0A4DFF"/>

    <!-- Dashboard badge -->
    <circle cx="782" cy="556" r="122" fill="url(#tealBlueGradient)"/>

    <!-- Chart bars -->
    <rect x="716" y="588" width="34" height="50" rx="7" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="770" y="558" width="34" height="80" rx="7" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="824" y="522" width="34" height="116" rx="7" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Growth line -->
    <path d="M706 544 L758 491 L802 507 L866 440"
          stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Brand name -->
  <g aria-label="FaktuDash">
    <text x="142" y="780" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="144" letter-spacing="-5" fill="#06133B">Faktu</text>
    <text x="650" y="780" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="144" letter-spacing="-5" fill="#0A4DFF">Dash</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="868" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="28" letter-spacing="11" fill="#06133B">
    FACTURA · ORGANIZA · COBRA · CRECE
  </text>
</svg>
